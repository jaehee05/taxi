<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0b0d">
<meta name="description" content="택시 미터기">
<title>택시 미터기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚕</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<div class="app">

  <header class="topbar">
    <div class="lamp" id="lamp">
      <span class="dot"></span>
      <span id="lampText">빈차</span>
    </div>
    <div class="badges">
      <span class="badge" id="surchargeBadge" hidden>심야할증 <b id="surchargeVal">20%</b></span>
      <span class="badge gps" id="gpsBadge">GPS 대기</span>
    </div>
  </header>

  <main class="meter">
    <div class="fare-wrap">
      <div class="fare-label">요금</div>
      <div class="fare-row">
        <div class="fare" id="fare">0</div>
        <div class="fare-unit">원</div>
      </div>
    </div>

    <div class="hint" id="hint"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="dist">0.00</div>
        <div class="stat-key">거리 (km)</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="time">00:00</div>
        <div class="stat-key">시간</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="speed">0</div>
        <div class="stat-key">속도 (km/h)</div>
      </div>
    </div>
  </main>

  <div class="controls">
    <div class="out">
      <button class="out-btn" id="outBtn">시계외 할증</button>
      <div class="out-note" id="outNote"></div>
    </div>
    <button class="go" id="go">운행 시작</button>
  </div>

  <footer class="bottombar">
    <button class="link" id="openHistory">기록</button>
    <button class="link" id="openLedger">장부</button>
    <span class="owed" id="owed"></span>
    <button class="link" id="openSettings">설정</button>
  </footer>

</div>

<!-- 영수증 -->
<div class="overlay" id="receiptOverlay" hidden>
  <div class="receipt">
    <div class="paper" id="rPaper"></div>
    <div class="r-guest">
      <span class="r-guest-label">손님</span>
      <div class="r-guest-chips" id="rGuests"></div>
    </div>
    <div class="r-actions">
      <button class="btn ghost" id="rClose">닫기</button>
      <button class="btn" id="rShare">이미지로 보내기</button>
    </div>
    <div class="r-alts">
      <button class="r-alt" id="rLink">링크로 보내기</button>
      <button class="r-alt" id="rText">텍스트로 복사</button>
    </div>
  </div>
</div>

<!-- 설정 -->
<div class="overlay" id="settingsOverlay" hidden>
  <div class="sheet">
    <h2>요금표 설정</h2>
    <div class="seg">
      <button class="seg-btn" data-region="seongnam">성남 · 분당</button>
      <button class="seg-btn" data-region="seoul">서울</button>
    </div>
    <p class="sheet-desc">지역을 고르면 해당 요금표와 시 경계가 적용됩니다. 요금이 인상됐거나 장난용으로 바꾸고 싶으면 아래 숫자를 직접 고치세요.</p>
    <label>기본요금 (원)<input type="number" id="s_base" min="0" step="100"></label>
    <label>기본거리 (m)<input type="number" id="s_baseDist" min="0" step="100"></label>
    <label>거리요금 단위 (m당)<input type="number" id="s_unitDist" min="1" step="1"></label>
    <label>시간요금 단위 (초당)<input type="number" id="s_unitTime" min="1" step="1"></label>
    <label>단위요금 (원)<input type="number" id="s_unitFare" min="0" step="10"></label>
    <label>시계외 할증률 (%)<input type="number" id="s_outPct" min="0" step="5"></label>
    <p class="derived" id="s_derived"></p>
    <label class="row"><input type="checkbox" id="s_night"> <span id="s_nightDesc">심야할증 자동 적용</span></label>
    <label class="row"><input type="checkbox" id="s_autoOut"> <span id="s_autoOutDesc">시계외 자동 판정</span></label>
    <label class="row"><input type="checkbox" id="s_sim"> 시뮬레이션 모드 (GPS 없이 가상 주행)</label>
    <div class="cloud" id="s_cloud"></div>
    <button class="btn wide ghost" id="s_link">구글 계정 연결</button>
    <button class="btn wide ghost" id="s_unlink" hidden>계정 연결 해제</button>

    <div class="sheet-actions">
      <button class="btn ghost" id="s_reset">기본값 복원</button>
      <button class="btn" id="s_close">저장하고 닫기</button>
    </div>
  </div>
</div>

<!-- 미수금 장부 -->
<div class="overlay" id="ledgerOverlay" hidden>
  <div class="sheet">
    <h2>미수금 장부</h2>
    <p class="sheet-desc" id="ledgerTotal"></p>
    <div id="ledgerList" class="history"></div>
    <div class="sheet-actions">
      <button class="btn" id="l_close">닫기</button>
    </div>
  </div>
</div>

<!-- 기록 -->
<div class="overlay" id="historyOverlay" hidden>
  <div class="sheet">
    <h2>운행 기록</h2>
    <div id="historyList" class="history"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="h_clear">전체 삭제</button>
      <button class="btn" id="h_close">닫기</button>
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="receipt.js"></script>
<script src="app.js"></script>
<script type="module" src="cloud.js"></script>
</body>
</html>
